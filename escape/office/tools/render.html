<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#000}</style>
<script type="importmap">{"imports":{"three":"/three/build/three.module.js","three/addons/":"/three/examples/jsm/"}}</script></head><body>
<script type="module">
import * as THREE from 'three';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
import { buildOffice } from './office_scene.js';
const W = 1280, H = 720;
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
r.setSize(W, H); r.shadowMap.enabled = true; r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 1.15;
document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color('#07080c'); scene.fog = new THREE.Fog('#07080c', 12, 30);
const office = buildOffice(); scene.add(office.root);
const cam = new THREE.PerspectiveCamera(55, W / H, .05, 60);
const V = (x, y, z) => new THREE.Vector3(x, y, z);
// klíčové snímky kamery: [čas, pozice, cíl]
const K = [
  [0, V(-5.5, 6.5, -4.5), V(0, 0, .5)],
  [3, V(5.5, 6.0, -3.5), V(0, .3, 1)],
  [5.2, V(4.0, 4.5, 6.5), V(0, .5, 2)],
  [6.5, V(-.6, 1.7, 3.9), V(-1.6, 1.4, 2.6)],
  [8.0, V(1.3, 1.65, 3.0), V(1.5, 1.3, 5.0)],
  [10.0, V(1.6, 1.6, 5.85), V(1.1, 1.3, 5.0)],
  [11.0, V(1.6, 1.6, 5.85), V(1.5, 1.4, 4.2)],
];
const ease = x => x * x * (3 - 2 * x);
function camAt(t) {
  let i = 0; while (i < K.length - 1 && t > K[i + 1][0]) i++;
  const a = K[i], b = K[Math.min(i + 1, K.length - 1)];
  const u = b === a ? 0 : ease(Math.min(1, Math.max(0, (t - a[0]) / (b[0] - a[0]))));
  const p = a[1].clone().lerp(b[1], u), q = a[2].clone().lerp(b[2], u);
  const dy = office.parts.car.position.y; // v kabině jede kamera s ní
  if (t > 11) { p.y += dy; q.y += dy; }
  cam.position.copy(p); cam.lookAt(q);
}
window.renderFrame = (t) => { office.pose(t); camAt(t); r.render(scene, cam); return office.state.name; };
window.exportGLB = () => new Promise((res, rej) => {
  office.pose(0);
  new GLTFExporter().parse(office.root, (buf) => {
    const b = new Uint8Array(buf); let s = ''; for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000));
    res(btoa(s));
  }, rej, { binary: true });
});
window.ready = true;
</script></body></html>

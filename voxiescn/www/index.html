<script type="module">
// ====================================================================
//  NIGHT AT VOXIE'S 3D – noční hlídač ve Voxie's Fun Factory
// ====================================================================
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const HOUR = 70, MOVE_INT = 5;
const LOADS = []; // čekáme na modely před zobrazením menu
const SPEED = +new URLSearchParams(location.search).get('speed') || 1;
const FONT = "'Courier New', 'Lucida Console', monospace";
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
function load(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }
function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function idb() { return new Promise((res, rej) => { const r = indexedDB.open('voxies', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function idbGet(k) { try { const db = await idb(); return await new Promise(res => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(null); }); } catch (e) { return null; } }
async function idbSet(k, v) { try { const db = await idb(); db.transaction('kv', 'readwrite').objectStore('kv').put(v, k); } catch (e) {} }

// ====================================================================
//  RENDERER, SCÉNA
// ====================================================================
const glCanvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas: glCanvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.5));
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x020104);
scene.fog = new THREE.Fog(0x020104, 6, 30);

const officeCam = new THREE.PerspectiveCamera(72, 16 / 9, .05, 80);
const OFFICE_EYE = new THREE.Vector3(0, 1.35, 1.9);
officeCam.position.copy(OFFICE_EYE);

const hemi = new THREE.HemisphereLight(0x6a5aa0, 0x120a1c, .55); scene.add(hemi);
const officeLamp = new THREE.PointLight(0xffd9a0, 9, 9, 1.4); officeLamp.position.set(0, 2.8, .4); scene.add(officeLamp);
const roomLight = new THREE.PointLight(0xfff0d8, 18, 26, 1.1); scene.add(roomLight);
function hallSpot(x) { const s = new THREE.SpotLight(0xffe7b0, 0, 14, .55, .5, 1); s.position.set(x, 2.9, 1.2); s.target.position.set(x, 0, -2.5); scene.add(s, s.target); return s; }
const hallL = hallSpot(-5), hallR = hallSpot(5);
const redLight = new THREE.PointLight(0xff1010, 0, 6, 1.2); scene.add(redLight);
const doorGlow = new THREE.PointLight(0xa0c0ff, 0, 4, 1.5); doorGlow.position.set(-4.6, 1.9, 0); scene.add(doorGlow);

// ---------- textury z canvasu ----------
function canvasTex(w, h, draw, rep) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  if (rep) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep[0], rep[1]); t.magFilter = THREE.NearestFilter; }
  return t;
}
const checker = (a, b) => (x, w, h) => { const n = 8; for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) { x.fillStyle = (i + j) % 2 ? a : b; x.fillRect(i * w / n, j * h / n, w / n, h / n); } };
const matCache = new Map();
function mat(color, o = {}) {
  const k = color + JSON.stringify(o);
  if (!o.map && matCache.has(k)) return matCache.get(k);
  const m = new THREE.MeshLambertMaterial({ color, ...o });
  if (!o.map) matCache.set(k, m);
  return m;
}
const glow = c => new THREE.MeshBasicMaterial({ color: c, fog: true });
function box(w, h, d, m, x, y, z, parent = scene) { const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); b.position.set(x, y, z); parent.add(b); return b; }
function textPlane(text, w, h, color, opts = {}) {
  const px = 128, cw = Math.round(px * w / h * 1.0) * 2, ch = px * 2;
  const tex = canvasTex(cw, ch, (x, W, H) => {
    if (opts.bg) { x.fillStyle = opts.bg; x.fillRect(0, 0, W, H); }
    x.font = `bold ${opts.size || H * .55}px ${FONT}`; x.textAlign = 'center'; x.textBaseline = 'middle';
    const lines = text.split('\n'), lh = (opts.size || H * .55) * 1.1;
    lines.forEach((l, i) => {
      const y = H / 2 + (i - (lines.length - 1) / 2) * lh;
      if (opts.neon) { x.shadowColor = color; x.shadowBlur = 24; x.fillStyle = color; x.fillText(l, W / 2, y); x.shadowBlur = 8; x.fillStyle = '#fff'; x.fillText(l, W / 2, y); }
      else { x.fillStyle = color; x.fillText(l, W / 2, y); }
    });
  });
  const m = opts.lit ? new THREE.MeshLambertMaterial({ map: tex, transparent: !opts.bg }) : new THREE.MeshBasicMaterial({ map: tex, transparent: !opts.bg });
  const p = new THREE.Mesh(new THREE.PlaneGeometry(w, h), m);
  return p;
}
function place(o, x, y, z, ry = 0, parent = scene) { o.position.set(x, y, z); o.rotation.y = ry; parent.add(o); return o; }

  '1A': { x0: -6, x1: 6, z0: -30, z1: -22, h: 4, wall: '#2a0f3a', f: ['#1a0c22', '#2a1736'], open: { s: [[-4, 4]] } },

  '3': { x0: 10, x1: 22, z0: -22, z1: -10, wall: '#123a32', f: ['#0a1a18', '#14302a'], open: { w: [[-18, -14]], s: [[14, 18]] } },
  '5': { x0: -22, x1: -10, z0: -10, z1: -2, wall: '#44381a', f: ['#201a08', '#3a3010'], open: { n: [[-18, -14]], s: [[-18, -14]] } },
  '4': { x0: 10, x1: 22, z0: -10, z1: -2, wall: '#26262c', f: ['#151518', '#222228'], open: { n: [[14, 18]], s: [[14, 18]] } },

  '9': { x0: 4, x1: 6, z0: -12, z1: 1, wall: '#2e2040', f: ['#141018', '#2a2333'], open: { n: [[4, 6]], w: [[-1, 1]] } },

};
const DOOR_H = 2.5;
function buildRoom(r) {
  const h = r.h || H, w = r.x1 - r.x0, d = r.z1 - r.z0, cx = (r.x0 + r.x1) / 2, cz = (r.z0 + r.z1) / 2;
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(w, d), mat('#ffffff', { map: canvasTex(64, 64, checker(r.f[0], r.f[1]), [w / 2, d / 2]) }));
  floor.rotation.x = -Math.PI / 2; floor.position.set(cx, 0, cz); scene.add(floor);
  const ceil = new THREE.Mesh(new THREE.PlaneGeometry(w, d), mat('#0b0910')); ceil.rotation.x = Math.PI / 2; ceil.position.set(cx, h, cz); scene.add(ceil);
  const wm = mat(r.wall), trim = mat(shadeHex(r.wall, .35));
  const T = .1, inset = .05;
  const edge = (side, a0, a1, fixed) => {
    const ops = (r.open[side] || []).slice().sort((p, q) => p[0] - q[0]);
    let cur = a0;
    const seg = (s, e, y0, y1) => {
      if (e - s < .01) return;
      const len = e - s, mid = (s + e) / 2, hh = y1 - y0;
      if (side === 'n' || side === 's') box(len, hh, T, wm, mid, y0 + hh / 2, fixed);
      else box(T, hh, len, wm, fixed, y0 + hh / 2, mid);
    };
    for (const [s, e] of ops) { seg(cur, s, 0, h); seg(s, e, DOOR_H, h); cur = e; }
    seg(cur, a1, 0, h);
    // spodní lišta
    const len = a1 - a0, mid = (a0 + a1) / 2;
    if (side === 'n' || side === 's') box(len, .12, T * 1.4, trim, mid, .06, fixed); else box(T * 1.4, .12, len, trim, fixed, .06, mid);
  };
  edge('n', r.x0, r.x1, r.z0 + inset); edge('s', r.x0, r.x1, r.z1 - inset);
  edge('w', r.z0, r.z1, r.x0 + inset); edge('e', r.z0, r.z1, r.x1 - inset);
}
function shadeHex(hex, f) { const c = new THREE.Color(hex); c.lerp(new THREE.Color(f > 0 ? '#ffffff' : '#000000'), Math.abs(f)); return '#' + c.getHexString(); }
Object.values(ROOMS).forEach(buildRoom);

// neonové pásy podél stěn místností
function neonStrip(x0, z0, x1, z1, y, c) { const len = Math.hypot(x1 - x0, z1 - z0); const m = box(len, .05, .05, glow(c), (x0 + x1) / 2, y, (z0 + z1) / 2); m.rotation.y = -Math.atan2(z1 - z0, x1 - x0); return m; }

// ---------- rekvizity ----------
const animated = []; // {mesh, f(t)}
const R = (s => () => { s = (s * 16807) % 2147483647; return s / 2147483647; })(1997);

function arcade(x, z, ry, col) {
  const g = new THREE.Group();
  box(.8, 1.8, .7, mat('#15121e'), 0, .9, 0, g);
  const scr = box(.6, .45, .02, glow(col), 0, 1.25, .36, g);
  box(.7, .18, .05, glow(shadeHex(col, .3)), 0, 1.68, .34, g);
  box(.7, .08, .35, mat('#2a2636'), 0, .95, .45, g);
  box(.06, .12, .06, glow('#ff3b3b'), -.15, 1.05, .5, g);
  place(g, x, 0, z, ry);
  const base = new THREE.Color(col), ph = R() * 10;
  animated.push(t => scr.material.color.copy(base).multiplyScalar(.6 + .4 * Math.sin(t * 2.3 + ph)));
  scr.material = scr.material.clone();
}

  place(textPlane('DJ REWIND\nMIMO PROVOZ', 1.4, .5, '#ff8a3b', { size: 44 }), 3.6, 1.2, -27.14);

  for (const [x, z] of [[-19, -18], [-15, -18], [-19, -13], [-15, -13], [-12, -15.5]]) {
    const t = new THREE.Mesh(new THREE.CylinderGeometry(.8, .8, .08, 20), cloth); t.position.set(x, .78, z); scene.add(t);
    box(.1, .75, .1, mat('#333'), x, .38, z);
    for (let k = 0; k < 3; k++) { const c = new THREE.Mesh(new THREE.ConeGeometry(.1, .3, 8), mat(cols[k])); c.position.set(x + Math.cos(k * 2.1) * .45, .97, z + Math.sin(k * 2.1) * .45); scene.add(c); }
  }
  // --- 3 bludiště, 4 sklad, 5 výdej lístků: modely ballpit/storage/tickets.glb ---
  place(textPlane('BLUDIŠTĚ', 3, .7, '#7cff6b', { neon: true }), 16, 2.8, -21.9);
  // míčky v bazénu
  const pit = new THREE.InstancedMesh(new THREE.SphereGeometry(.13, 8, 6), new THREE.MeshLambertMaterial(), 520), m4 = new THREE.Matrix4(), cl = new THREE.Color();
  for (let i = 0; i < 520; i++) { m4.makeTranslation(rand(13.6, 19.6), rand(.25, .62), rand(-15.2, -12.2)); pit.setMatrixAt(i, m4); pit.setColorAt(i, cl.set(pick(['#ff3b3b', '#ffe46b', '#3bb2ff', '#7cff6b', '#ff2bd6']))); }
  scene.add(pit);
  place(textPlane('VÝDEJ LÍSTKŮ', 3, .5, '#ffe46b', { neon: true }), -21.9, 2.4, -6, Math.PI / 2);
  // --- 6 toalety: kabinky na zadní stěně naproti vchodu ---
  for (const [x, c, t] of [[-2, '#5a3a8a', 'CHLAPCI'], [2, '#8a3a5a', 'DÍVKY']]) {
    box(1.8, 2.2, .06, mat(c), x, 1.1, -3.15); box(.06, 2.2, 1.4, mat('#cfe0e0'), x - .95, 1.1, -3.8); box(.06, 2.2, 1.4, mat('#cfe0e0'), x + .95, 1.1, -3.8);
    place(textPlane(t, 1.2, .3, '#fff', {}), x, 2.45, -3.2, Math.PI);
  }
  box(.03, 1, 2.2, mat('#9ab'), -3.92, 1.7, -8.5); box(.5, .8, 2.4, mat('#dfe8e8'), -3.7, .4, -8.5);
  box(.03, 1, 2.2, mat('#9ab'), 3.92, 1.7, -8.5); box(.5, .8, 2.4, mat('#dfe8e8'), 3.7, .4, -8.5);
  // --- 7 vchod: model entrance.glb ---
  // --- chodby 8, 9 ---
  for (const x of [-5, 5]) {
    for (let i = 0; i < 4; i++) {
      const f = box(.8, .05, .2, glow('#fff3c4'), x, H - .03, -10 + i * 3);
      if (i === 2) { f.material = f.material.clone(); animated.push(t => f.material.color.setScalar(Math.sin(t * 13) > .55 ? .15 : 1)); }
    }
    for (let i = 0; i < 3; i++) { const p = textPlane(pick(['BAV SE!', 'VOXIE\nTĚ VIDÍ', 'OSLAVY\nKAŽDÝ DEN', '1997']), .9, 1.2, '#ffe46b', { bg: pick(['#3b1d6e', '#14313d', '#4a1438']), lit: true, size: 46 }); place(p, x + (x < 0 ? -.94 : .94), 1.6, -10 + i * 3.5, x < 0 ? Math.PI / 2 : -Math.PI / 2); }
  }
  neonStrip(-5.95, -12, -5.95, 1, .15, '#ff2bd6'); neonStrip(5.95, -12, 5.95, 1, .15, '#00e5ff');
}
props();
// pec a pokladna na objednávky (úkol 3. noci)
const oven = new THREE.Group();
box(1.6, 1.6, 1.2, mat('#5a5a62'), 0, .8, 0, oven); box(1.2, .5, .05, glow('#ff6a1a'), 0, .9, .61, oven); box(1.7, .12, 1.3, mat('#333'), 0, 1.66, 0, oven);
place(oven, -20.9, 0, -17, Math.PI / 2);
const ovenMouth = oven.children[1]; ovenMouth.material = ovenMouth.material.clone();
const terminal = box(.5, .35, .1, glow('#5dff8a'), -16, 1.3, -21.0);
const pizzaMesh = new THREE.Mesh(new THREE.CylinderGeometry(.22, .22, .04, 16), mat('#e8b04a')); pizzaMesh.visible = false; scene.add(pizzaMesh);

// sekera (noc 7) a server kamer (noci 5–6)
const axeMesh = new THREE.Group();
box(.07, 1.1, .07, mat('#7a4a22'), 0, .55, 0, axeMesh); box(.4, .25, .05, mat('#c0c4cc'), .15, 1.0, 0, axeMesh); box(.1, .25, .06, mat('#b00000'), -.02, 1.0, 0, axeMesh);

// sekera v ruce (první osoba)
const heldAxe = new THREE.Group();
box(.05, .7, .05, mat('#7a4a22'), 0, 0, 0, heldAxe); box(.28, .18, .04, mat('#c0c4cc'), .1, .32, 0, heldAxe);
heldAxe.position.set(.38, -.42, -.7); heldAxe.rotation.set(.3, 0, -.25); heldAxe.visible = false;
// model sekery z axe.glb nahradí kostičkovou
LOADS.push(new GLTFLoader().loadAsync('models/axe.glb').then(g => {
  const make = (len, parent) => { const m = g.scene.clone(true), b = new THREE.Box3().setFromObject(m), sz = b.getSize(new THREE.Vector3()); const k = len / sz.y; m.scale.setScalar(k); m.position.set(-(b.min.x + b.max.x) / 2 * k, -b.min.y * k, -(b.min.z + b.max.z) / 2 * k); parent.clear(); parent.add(m); };
  make(1.0, axeMesh);
  const hold = new THREE.Group(); make(.75, hold); hold.position.y = -.3; heldAxe.clear(); heldAxe.add(hold);

// ---------- modely místností (vybavení z GLB; zdi a podlahy jsou naše, aby seděly průchody) ----------
// bounds = vnitřek místnosti v modelu (co je mimo, jsou zbytky a vyhodí se), room = kam ji posadit
const ROOM_MODELS = [
  // herna: automaty dočasně odstraněny – čekají na nové modely
  { file: 'ballpit', room: '3', bounds: [-6.2, -7.2, 6.2, 7.2] },
  { file: 'storage', room: '4', bounds: [-5.92, -5.17, 5.92, 5.17] },
  { file: 'tickets', room: '5', bounds: [-5.67, -5.17, 5.67, 5.17] },
  { file: 'entrance', room: '7', bounds: [-6.17, -5.67, 6.17, 5.67] },
];
// automaty v herně (cabinet.glb) – model má přední stranu natočenou šikmo (-x, -z)
const CAB_FRONT = Math.atan2(-1, -1);
const CABINETS = [
  ...[-9, -7.6, -6.2, 6.2, 7.6, 9].map(x => [x, -21.3, 0]),          // u severní zdi, čelem do herny
  ...[-7.9, 7.9].flatMap(x => [[x, -17.4, Math.PI], [x, -15.6, 0]]),   // dvojice uprostřed, zády k sobě
  ...[-19.2, -12.9].flatMap(z => [[-9.3, z, Math.PI / 2], [9.3, z, -Math.PI / 2]]), // u bočních zdí
];
LOADS.push(new GLTFLoader().loadAsync('models/cabinet.glb').then(g => {
  const src = g.scene, b0 = new THREE.Box3().setFromObject(src), c0 = b0.getCenter(new THREE.Vector3());

const ADJ = {};
for (const g of GAPS) {
  if (g.door) continue;
  const cx = (g[0] + g[2]) / 2, cz = (g[1] + g[3]) / 2, rs = new Set();
  for (const [ox, oz] of [[0, .9], [0, -.9], [.9, 0], [-.9, 0]]) { const r = roomAt(cx + ox, cz + oz); if (r) rs.add(r); }
  const [a, b] = [...rs]; if (!a || !b) continue;
  (ADJ[a] = ADJ[a] || []).push({ to: b, p: [cx, cz] }); (ADJ[b] = ADJ[b] || []).push({ to: a, p: [cx, cz] });
}
function navPath(from, to) {
  const ra = roomAt(from.x, from.z), rb = roomAt(to.x, to.z), pts = [from.clone()];
  if (ra && rb && ra !== rb) {
    const prev = { [ra]: null }, q = [ra];
    while (q.length) { const r = q.shift(); if (r === rb) break; for (const e of ADJ[r] || []) if (!(e.to in prev)) { prev[e.to] = { r, p: e.p }; q.push(e.to); } }
    const mids = []; let r = rb; while (prev[r]) { mids.unshift(prev[r].p); r = prev[r].r; }
    for (const [x, z] of mids) pts.push(new THREE.Vector3(x, 0, z));
  }
  pts.push(to.clone());
  return pts;
}
function startWalk(a, from) {
  const ch = AI[a.id].ch, to = ch.root.position.clone();
  if (from.distanceTo(to) < .2) return;
  a.endYaw = ch.root.rotation.y; a.path = navPath(from, to); a.seg = 1;
  ch.root.position.copy(from);
}
function walkStep(a, ch, dt) {
  const P = a.path; let step = (a.speed || 1.7) * dt;
  while (step > 0 && a.seg < P.length) {
    const tgt = P[a.seg], cur = ch.root.position, dx = tgt.x - cur.x, dz = tgt.z - cur.z, dy = tgt.y - cur.y, d = Math.hypot(dx, dz);
    if (d <= step) { cur.copy(tgt); step -= d; a.seg++; continue; }
    cur.x += dx / d * step; cur.z += dz / d * step; cur.y += dy * Math.min(1, step / d);
    const want = Math.atan2(dx, dz); let df = want - ch.root.rotation.y; df = Math.atan2(Math.sin(df), Math.cos(df)); ch.root.rotation.y += df * Math.min(1, dt * 8);
    step = 0;
  }
  if (a.seg >= P.length) { a.path = null; ch.root.rotation.y = a.endYaw; }
}

<style>html, body { margin: 0; height: 100%; background: #050404; overflow: hidden; } canvas { display: block; width: 100%; height: 100%; }

<body>
<div id="t">HOLLOW HARE</div><div id="s">Night at Voxie's 4 · springlockový oblek, uvnitř D.</div>
<canvas id="gl"></canvas>
<script type="importmap">{ "imports": { "three": "./lib/three.module.js", "three/addons/": "./lib/addons/" } }</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
const rand = (a, b) => a + Math.random() * (b - a);
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gl'), antialias: true }); renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x080606); scene.fog = new THREE.Fog(0x080606, 6, 16);
const cam = new THREE.PerspectiveCamera(42, 1, .05, 50); cam.position.set(2.2, 1.7, 3.6);
const ctl = new OrbitControls(cam, renderer.domElement); ctl.target.set(0, 1.25, 0); ctl.update();
scene.add(new THREE.HemisphereLight(0x606858, 0x100808, .45));
const key = new THREE.SpotLight(0xffe0b0, 14, 12, .6, .5, 1.3); key.position.set(.8, .1, 2.6); key.target.position.set(0, 1.2, 0); scene.add(key, key.target);
const rim = new THREE.PointLight(0x60ff90, 10, 6); rim.position.set(-2, 2, -1.5); scene.add(rim);
const red = new THREE.PointLight(0xff2010, 3, 4); red.position.set(.5, .6, 1.2); scene.add(red);
{ const f = new THREE.Mesh(new THREE.CircleGeometry(5, 40), new THREE.MeshLambertMaterial({ color: 0x15110e })); f.rotation.x = -Math.PI / 2; scene.add(f); }
function canvasTex(w, h, draw) { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.magFilter = THREE.NearestFilter; return t; }
// shnilá žlutozelená srst se skvrnami, dírami a švy
const furTex = canvasTex(32, 32, (x, w, h) => { x.fillStyle = '#5e5e2a'; x.fillRect(0, 0, w, h); for (let i = 0; i < 3; i++) { x.fillStyle = `rgba(90,10,6,${rand(.5, .8)})`; const bx = rand(0, w), by = rand(0, h); x.fillRect(bx, by, rand(3, 8), rand(2, 5)); x.fillRect(bx + 1, by, 2, rand(6, 14)); } for (let i = 0; i < 40; i++) { x.fillStyle = `rgba(${Math.random() < .5 ? '40,40,10' : '120,110,60'},${rand(.3, .7)})`; x.fillRect(rand(0, w), rand(0, h), rand(1, 4), rand(1, 4)); } for (let i = 0; i < 3; i++) { x.fillStyle = '#1a1008'; x.fillRect(rand(0, w - 6), rand(0, h - 6), rand(2, 6), rand(2, 5)); } x.strokeStyle = 'rgba(0,0,0,.35)'; x.strokeRect(.5, .5, w - 1, h - 1); });
const mat = c => new THREE.MeshLambertMaterial({ color: c });
const fur = new THREE.MeshLambertMaterial({ map: furTex }), dark = mat('#4a4a20'), belly = mat('#a8a070'), flesh = mat('#6a2a24'), skin = mat('#b08a78'), metal = mat('#6a6e74'), wire = [mat('#c0201a'), mat('#2050c0'), mat('#d0b020'), mat('#202020')];
const box = (w, h, d, m, x, y, z, p) => { const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); b.position.set(x, y, z); p.add(b); return b; };
const node = (p, x, y, z) => { const n = new THREE.Group(); n.position.set(x, y, z); p.add(n); return n; };
const tube = (p, pts, r, m) => p.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts.map(a => new THREE.Vector3(...a))), 12, r, 5), m));
const H = new THREE.Group(); scene.add(H);
const hips = node(H, 0, .85, 0); hips.rotation.z = .05;
// nohy (pravá roztržená v koleni, vidět kov a maso)
for (const s of [-1, 1]) { const l = node(hips, s * .2, 0, 0); box(.26, .46, .3, fur, 0, -.23, 0, l); const k = node(l, 0, -.46, 0); k.rotation.x = s > 0 ? .12 : 0;
  box(.24, .34, .28, fur, 0, -.17, 0, k); box(.32, .12, .46, dark, 0, -.34, .08, k);
  if (s > 0) { box(.26, .08, .3, flesh, 0, .0, 0, k); box(.05, .2, .05, metal, .08, -.02, .1, k); tube(k, [[.05, .1, .14], [.12, -.05, .18], [.06, -.2, .16]], .012, wire[0]); } }
// trup: díra v břiše, lidské žebra a springlocky
const chest = node(hips, 0, .05, 0); chest.rotation.x = .42; chest.rotation.z = -.1;
box(.84, .76, .56, fur, 0, .38, 0, chest); box(.54, .5, .02, belly, 0, .34, .29, chest);
box(.3, .32, .06, mat('#0a0505'), .08, .3, .29, chest); for (let i = 0; i < 4; i++) box(.26, .03, .04, mat('#d8c8b0'), .08, .2 + i * .065, .3, chest); // díra a žebra
for (const [x, y] of [[-.3, .55], [.3, .55], [-.3, .15], [.3, .15]]) { box(.07, .07, .07, metal, x, y, .29, chest); box(.03, .1, .03, metal, x, y - .06, .31, chest); }
for (let i = 0; i < 6; i++) tube(chest, [[rand(-.1, .2), .4, .1], [rand(-.25, .3), .25, .32], [rand(-.3, .35), rand(-.1, .1), .38]], .013, wire[i % 4]);
box(.1, .55, .02, mat('#2a1a10'), -.25, .38, .29, chest); for (let i = 0; i < 6; i++) box(.06, .015, .03, mat('#b0a080'), -.25, .14 + i * .09, .3, chest); // zašitý šev
// ruce: levá visí, pravá ohnutá s odhalenou lidskou rukou
const aL = node(chest, .54, .66, 0); aL.rotation.z = .25; box(.22, .42, .24, fur, 0, -.21, 0, aL); const aL2 = node(aL, 0, -.42, 0); aL2.rotation.x = -.1; box(.2, .36, .22, fur, 0, -.18, 0, aL2); box(.24, .12, .26, dark, 0, -.38, 0, aL2); for (const dx of [-.07, 0, .07]) { const c = box(.03, .16, .03, metal, dx, -.5, .04, aL2); c.rotation.x = .4; }
const aR = node(chest, -.54, .66, 0); aR.rotation.set(-.5, 0, -.3); box(.22, .42, .24, fur, 0, -.21, 0, aR); const aR2 = node(aR, 0, -.42, 0); aR2.rotation.x = -.9; box(.2, .18, .22, fur, 0, -.09, 0, aR2);
box(.09, .16, .09, skin, 0, -.26, .02, aR2); for (const dx of [-.04, 0, .04]) box(.025, .1, .025, skin, dx, -.38, .03, aR2); box(.12, .05, .12, flesh, 0, -.18, 0, aR2);
// hlava: zaječí, s jedním ulomeným uchem, propadlou čelistí a lidskýma očima uvnitř
const head = node(chest, 0, .8, .06); head.rotation.set(-.25, .3, .28);
box(.82, .66, .7, fur, 0, .33, 0, head); box(.84, .12, .72, dark, 0, .68, 0, head); // čelo s propadlinou
for (const s2 of [-1, 1]) box(.12, .2, .5, mat('#4a4a20'), s2 * .42, .32, 0, head);
// rozšklebená tlama: tmavá dutina, ostré zuby kostýmu a za nimi lidské zuby
box(.62, .3, .3, mat('#060202'), 0, .08, .3, head);
const jaw = node(head, 0, .02, .12); jaw.rotation.x = .75; box(.6, .12, .52, fur, 0, -.06, .1, jaw); box(.5, .03, .4, mat('#3a0806'), 0, .0, .1, jaw);
for (let i = 0; i < 7; i++) { const t1 = box(.05, .12, .04, mat('#d8cc9a'), -.24 + i * .08, .06, .32, jaw); t1.rotation.z = rand(-.3, .3); const t2 = box(.05, .13, .04, mat('#c8bc8a'), -.24 + i * .08, .17, .43, head); t2.rotation.z = rand(-.3, .3); t2.rotation.x = .2; }
for (let i = 0; i < 6; i++) box(.045, .05, .03, mat('#f0e8d8'), -.11 + i * .045, .11, .33, head); // lidské zuby uvnitř
box(.46, .22, .22, mat('#7a7050'), 0, .3, .38, head); box(.12, .08, .06, mat('#2a0a06'), 0, .38, .5, head); // čenich
for (const s2 of [-1, 1]) { box(.26, .24, .05, mat('#000000'), s2 * .2, .52, .34, head); // hluboké černé důlky
  const e = new THREE.Mesh(new THREE.SphereGeometry(.04, 12, 10), mat('#d8d0b8')); e.position.set(s2 * .2, .5, .345); head.add(e);
  const iris = new THREE.Mesh(new THREE.SphereGeometry(.014, 10, 8), new THREE.MeshBasicMaterial({ color: 0xc8ffd0 })); iris.position.set(s2 * .2 + .006, .5, .382); head.add(iris);
  const gl = new THREE.PointLight(0x80ffa0, .8, .6); gl.position.set(s2 * .2, .5, .42); head.add(gl);
  box(.03, .12, .02, mat('#5a0806'), s2 * .2 + .04, .37, .375, head); } // krvavé slzy
for (let i = 0; i < 4; i++) tube(head, [[rand(-.3, .3), .1, .3], [rand(-.3, .3), -.05, .38], [rand(-.3, .3), -.2, .36]], .01, wire[i % 4]);
// uši: levé dlouhé a zlomené, pravé utržené s kabely
const eL = node(head, .2, .7, -.05); eL.rotation.z = -.15; box(.14, .7, .1, fur, 0, .35, 0, eL); const eL2 = node(eL, 0, .7, 0); eL2.rotation.z = -2.0; box(.13, .45, .09, fur, 0, .22, 0, eL2); box(.14, .06, .11, flesh, 0, .0, 0, eL2); box(.07, .3, .02, mat('#8a5a50'), 0, .25, .06, eL);
const eR = node(head, -.2, .7, -.05); box(.14, .14, .1, fur, 0, .07, 0, eR); box(.06, .06, .06, metal, 0, .16, 0, eR); tube(eR, [[0, .14, 0], [-.05, .3, .02], [-.12, .36, -.05]], .012, wire[0]); tube(eR, [[0, .14, 0], [.04, .28, -.03], [.02, .4, .02]], .012, wire[1]);
// ocas
box(.2, .2, .18, mat('#a8a070'), 0, .1, -.36, hips);
H.traverse(o => { if (o.isMesh) o.castShadow = true; });
function resize() { renderer.setSize(innerWidth, innerHeight, false); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); } addEventListener('resize', resize); resize();
const clock = new THREE.Clock();
function loop() { const t = clock.getElapsedTime(); if (!window.__still) H.rotation.y = Math.sin(t * .4) * .6; jaw.rotation.x = .75 + (Math.sin(t * 9) > .9 ? .15 : 0); head.rotation.z = .28 + (Math.sin(t * 13) > .95 ? rand(-.3, .3) : 0); red.intensity = Math.random() < .9 ? 3 : .5; renderer.render(scene, cam); requestAnimationFrame(loop); }
loop();
window.__hare = { set(y, cx, cy, cz, tx = 0, ty = 1.25) { window.__still = true; H.rotation.y = y; cam.position.set(cx, cy, cz); ctl.target.set(tx, ty, 0); ctl.update(); } };

<body><div id="t">VOXIE – CO ZBYLO</div><div id="s">Night at Voxie's 4/5 · zničený Voxie z 2. dílu po dalším požáru</div><canvas id="gl"></canvas>
<script type="importmap">{ "imports": { "three": "./lib/three.module.js", "three/addons/": "./lib/addons/" } }</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
const rand = (a, b) => a + Math.random() * (b - a);
function canvasTex(w, h, draw) { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.magFilter = THREE.NearestFilter; return t; }

const scene = new THREE.Scene(); scene.background = new THREE.Color(0x080404); scene.fog = new THREE.Fog(0x080404, 6, 16);

{ const f = new THREE.Mesh(new THREE.CircleGeometry(5, 40), mat('#120c08')); f.rotation.x = -Math.PI / 2; scene.add(f); }
const burnTex = canvasTex(64, 64, (x, w, h) => { x.fillStyle = '#5a3818'; x.fillRect(0, 0, w, h); for (let i = 0; i < 40; i++) { x.fillStyle = `rgba(0,0,0,${rand(.3, .8)})`; x.beginPath(); x.arc(rand(0, w), rand(0, h), rand(2, 9), 0, 7); x.fill(); } });
const fur = new THREE.MeshLambertMaterial({ map: burnTex }), metal = mat('#7a7f88'), dMetal = mat('#3a3d44');
function makeVoxie() {

  const hips = node(g, 0, .8, 0);

  box(.82, .5, .7, fur, 0, .38, 0, head); box(.3, .12, .7, dMetal, -.25, .08, 0, head);

  const ear = node(head, .3, .64, 0); ear.rotation.z = -.7; box(.22, .2, .14, fur, 0, .1, 0, ear);
  box(.18, .16, .03, mat('#111'), -.19, .44, .355, head); const redEye = box(.05, .05, .02, new THREE.MeshBasicMaterial({ color: 0xff1010 }), -.19, .44, .37, head);
  const eyeL = new THREE.Mesh(new THREE.SphereGeometry(.07, 10, 8), mat('#e8e8e0')); eyeL.position.set(.2, .28, .42); head.add(eyeL);

const V = makeVoxie(); scene.add(V); const u = V.userData;
// z obleku zbyly jen cáry: většina srsti zmizí a nahradí ji kovová kostra
const metal2 = mat('#6a6e74'), dmetal2 = mat('#3a3c40'), charM = mat('#140c08'), ember = new THREE.MeshBasicMaterial({ color: 0xff6a20 });
const furs = []; V.traverse(o => { if (o.isMesh && o.material === fur) furs.push(o); });
const burntFur = new THREE.MeshLambertMaterial({ map: fur.map, color: '#9a8070' });

  const keep = Math.random() < .66 || p.width > .7;
  if (keep) { o.material = burntFur; if (Math.random() < .4) { box(rand(.1, .2), rand(.1, .2), .03, mat('#050302'), pos.x + rand(-p.width * .3, p.width * .3), pos.y + rand(-p.height * .3, p.height * .3), pos.z + p.depth / 2 + .01, par); box(.04, rand(.1, .18), .04, metal2, pos.x, pos.y, pos.z + p.depth / 2 - .02, par); } return; }
  o.visible = false; const big = p.width > .5 || p.depth > .5;
  if (big) { for (const sx of [-1, 1]) box(.04, p.height, .04, metal2, pos.x + sx * p.width * .4, pos.y, pos.z, par); box(p.width * .9, .04, .04, metal2, pos.x, pos.y + p.height * .45, pos.z, par); }
  else { box(.06, p.height * .95, .06, metal2, pos.x, pos.y, pos.z, par); box(.1, .08, .1, dmetal2, pos.x, pos.y + p.height * .45, pos.z, par); } });
box(.14, .12, .05, mat('#3a3c40'), .25, .5, .3, u.head); box(.04, .2, .04, mat('#6a6e74'), -.32, .45, .2, u.head); // kov pod spálenou tváří
// uhlíky
const embers = []; for (let i = 0; i < 22; i++) { const e = box(.025, .025, .025, ember, rand(-.4, .4), rand(.2, 2), rand(-.3, .3), V); e.userData.ph = rand(0, 9); embers.push(e); }
for (let i = 0; i < 14; i++) { const a = rand(0, 6.28), r = rand(.8, 2.4); const b = box(rand(.2, .6), rand(.05, .25), rand(.2, .6), mat('#1a120c'), Math.cos(a) * r, .08, Math.sin(a) * r, scene); b.rotation.y = rand(0, 3); }
u.jaw.rotation.x = .8; u.head.rotation.set(.2, -.3, .4);
function resize() { renderer.setSize(innerWidth, innerHeight, false); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); } addEventListener('resize', resize); resize();
const clock = new THREE.Clock();
function loop() { const t = clock.getElapsedTime(); if (!window.__still) V.rotation.y = Math.sin(t * .35) * .6; embers.forEach(e => e.scale.setScalar(.6 + Math.abs(Math.sin(t * 3 + e.userData.ph)) * .8));
  u.redEye.getWorldPosition(red.position); red.intensity = Math.random() < .9 ? 2 : .3; fire1.intensity = 12 + Math.random() * 5; renderer.render(scene, cam); requestAnimationFrame(loop); }
loop();
window.__b = { set(y, cx, cy, cz, tx = 0, ty = 1.2) { window.__still = true; V.rotation.y = y; cam.position.set(cx, cy, cz); ctl.target.set(tx, ty, 0); ctl.update(); } };

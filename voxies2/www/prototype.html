<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: 'Courier New', monospace; color: #eee; touch-action: none; }

<body>
<div id="ui">
  <h1>NIGHT AT VOXIE'S 2 · PROTOTYP</h1>
  <button data-v="voxie" class="on">Zničený Voxie</button>
  <button data-v="shadow">Stínová Cocoa</button>
  <button data-v="ruins">Zničená restaurace</button>
</div>
<div id="info"></div>
<script type="importmap">

<script type="module">
// Prototyp modelů pro druhou hru: zničený Voxie, stínová Cocoa, vyhořelá restaurace (zatím ne hra)
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5)); renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace; document.body.prepend(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x030102); scene.fog = new THREE.Fog(0x030102, 6, 26);
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, .05, 100);
const controls = new OrbitControls(camera, renderer.domElement); controls.enableDamping = true;
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
const rand = (a, b) => a + Math.random() * (b - a);

const hemi = new THREE.HemisphereLight(0x50405a, 0x100606, .5); scene.add(hemi);
const key = new THREE.SpotLight(0xffd8b0, 40, 18, .55, .6, 1.2); key.position.set(3, 6, 4); scene.add(key, key.target);
const red = new THREE.PointLight(0xff2010, 6, 12, 1.3); red.position.set(-3, 3, -2); scene.add(red);

const mat = (c, o = {}) => new THREE.MeshLambertMaterial({ color: c, ...o });
function box(w, h, d, m, x, y, z, parent) { const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); b.position.set(x, y, z); parent.add(b); return b; }
function canvasTex(w, h, draw) { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; }
// ohořelá srst: hnědá s černými skvrnami sazí
const burnTex = canvasTex(64, 64, (x, w, h) => { x.fillStyle = '#5a3818'; x.fillRect(0, 0, w, h); for (let i = 0; i < 40; i++) { x.fillStyle = `rgba(0,0,0,${rand(.3, .8)})`; x.beginPath(); x.arc(rand(0, w), rand(0, h), rand(2, 9), 0, 7); x.fill(); } x.strokeStyle = 'rgba(0,0,0,.4)'; x.strokeRect(1, 1, w - 2, h - 2); });
const fur = new THREE.MeshLambertMaterial({ map: burnTex }), metal = mat('#7a7f88'), darkMetal = mat('#3a3d44'), belly = mat('#8a6a40');

const views = {};
// ====================================================================
//  1) ZNIČENÝ VOXIE
// ====================================================================
{
  const g = new THREE.Group(); views.voxie = g; scene.add(g);
  const floor = new THREE.Mesh(new THREE.CircleGeometry(3, 40), mat('#151012')); floor.rotation.x = -Math.PI / 2; g.add(floor);
  const node = (p, x, y, z) => { const n = new THREE.Group(); n.position.set(x, y, z); p.add(n); return n; };
  const hips = node(g, 0, .8, 0);
  // nohy – levá celá, pravá s odhaleným kovem v koleni
  const lL = node(hips, .2, 0, 0); box(.26, .45, .3, fur, 0, -.22, 0, lL); const lL2 = node(lL, 0, -.45, 0); box(.24, .32, .28, fur, 0, -.16, 0, lL2); box(.3, .1, .4, mat('#2a1a0a'), 0, -.3, .05, lL2);
  const rL = node(hips, -.2, 0, 0); box(.26, .3, .3, fur, 0, -.15, 0, rL); box(.08, .2, .08, metal, 0, -.38, 0, rL); const rL2 = node(rL, 0, -.45, 0); box(.24, .32, .28, fur, 0, -.16, 0, rL2); box(.3, .1, .4, mat('#2a1a0a'), 0, -.3, .05, rL2);
  // trup s vyrvaným břichem – vidět endoskelet a kabely
  const chest = node(hips, 0, .05, .02); chest.rotation.x = .18;
  box(.8, .72, .2, fur, 0, .36, -.18, chest); box(.15, .72, .55, fur, -.33, .36, 0, chest); box(.15, .72, .55, fur, .33, .36, 0, chest); box(.8, .18, .55, fur, 0, .64, 0, chest);
  box(.5, .06, .06, metal, 0, .18, .05, chest); box(.06, .55, .06, metal, 0, .35, .02, chest); box(.36, .2, .18, darkMetal, 0, .42, -.02, chest);
  const wireMat = [mat('#c0201a'), mat('#2050c0'), mat('#d0b020')];
  for (let i = 0; i < 5; i++) { const pts = [new THREE.Vector3(rand(-.2, .2), .5, .05), new THREE.Vector3(rand(-.25, .25), .3, .3), new THREE.Vector3(rand(-.3, .3), rand(-.05, .15), .35)]; const tube = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 12, .015, 5), wireMat[i % 3]); chest.add(tube); }
  box(.18, .14, .06, mat('#7a1060'), -.11, .68, .29, chest); // jen půlka motýlku
  // levá ruka celá, pravá jen kostra s drápem
  const aL = node(chest, .52, .64, 0); box(.22, .4, .24, fur, 0, -.2, 0, aL); const aL2 = node(aL, 0, -.4, 0); box(.2, .34, .22, fur, 0, -.17, 0, aL2);
  const aR = node(chest, -.52, .64, 0); box(.22, .2, .24, fur, 0, -.1, 0, aR); box(.06, .3, .06, metal, 0, -.32, 0, aR);
  const aR2 = node(aR, 0, -.45, 0); box(.05, .32, .05, metal, 0, -.16, 0, aR2); for (const dx of [-.06, 0, .06]) { const cl = box(.025, .14, .025, metal, dx, -.36, .02, aR2); cl.rotation.x = .4; }
  // hlava: popraskaná, chybí pravé ucho, čelist visí
  const head = node(chest, 0, .76, 0); head.rotation.set(.25, -.2, .35);
  box(.82, .5, .7, fur, 0, .38, 0, head); box(.3, .12, .7, darkMetal, -.25, .08, 0, head);
  const jaw = node(head, 0, .12, .05); jaw.rotation.x = .55; box(.7, .14, .6, fur, 0, -.07, .05, jaw);
  for (let i = 0; i < 6; i++) { box(.06, .08, .04, mat('#d8d0b0'), -.25 + i * .1, .02, .34, jaw); box(.06, .08, .04, mat('#d8d0b0'), -.25 + i * .1, .1, .34, head); }
  const ear = node(head, .3, .64, 0); ear.rotation.z = -.7; box(.22, .2, .14, fur, 0, .1, 0, ear);
  box(.1, .08, .1, metal, -.3, .66, 0, head); // pahýl utrženého ucha
  // oči: levé visí z důlku, pravé jen rudý bod
  box(.18, .16, .03, mat('#111'), -.19, .44, .355, head); const redEye = box(.05, .05, .02, new THREE.MeshBasicMaterial({ color: 0xff1010 }), -.19, .44, .37, head);
  const eyeL = new THREE.Mesh(new THREE.SphereGeometry(.07, 10, 8), mat('#e8e8e0')); eyeL.position.set(.2, .28, .42); head.add(eyeL);
  box(.04, .04, .02, mat('#111'), .2, .26, .49, head);
  const cord = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3([new THREE.Vector3(.19, .44, .36), new THREE.Vector3(.21, .36, .42), new THREE.Vector3(.2, .32, .42)]), 6, .012, 4), mat('#902020')); head.add(cord);
  // jiskry
  const sparks = []; for (let i = 0; i < 14; i++) { const sp = new THREE.Mesh(new THREE.BoxGeometry(.025, .025, .025), new THREE.MeshBasicMaterial({ color: 0xffd060 })); g.add(sp); sparks.push({ m: sp, v: new THREE.Vector3(), life: 0 }); }
  const sparkLight = new THREE.PointLight(0xffc060, 0, 3); sparkLight.position.set(0, 1.4, .3); g.add(sparkLight);
  g.userData = {
    cam: [1.2, 1.5, 4.6], target: [0, 1.0, 0],
    info: '<b>ZNIČENÝ VOXIE</b><br>Po požáru zůstal jediný. Srst je ohořelá, chybí mu pravé ucho a ruka, čelist mu visí. Z rozbitého břicha trčí endoskelet a kabely. Jedno oko mu visí z důlku, druhé svítí rudě. Cuká sebou a jiskří. Nápad do hry: pohybuje se trhaně, mezi kamerami „přeskakuje“ a hlasitě jiskří, takže ho uslyšíš dřív, než ho uvidíš.',
    update(t, dt) {
      head.rotation.y = -.2 + (Math.sin(t * 13) > .92 ? rand(-.4, .4) : Math.sin(t * .6) * .1);
      jaw.rotation.x = .55 + Math.sin(t * 2) * .05 + (Math.random() < .02 ? .3 : 0);
      aR2.rotation.x = Math.sin(t * 1.4) * .15 + (Math.random() < .03 ? rand(-.6, .6) : 0);
      redEye.material.color.setRGB(Math.random() < .9 ? 1 : .2, 0, 0);
      eyeL.position.y = .28 + Math.sin(t * 3) * .015;
      let on = 0;
      if (Math.random() < .06) sparks.forEach(s => { if (s.life <= 0 && Math.random() < .5) { s.life = rand(.3, .7); s.m.position.set(rand(-.2, .2), 1.15, .3); s.v.set(rand(-1, 1), rand(.5, 2), rand(.2, 1.2)); } });
      sparks.forEach(s => { if (s.life > 0) { s.life -= dt; s.v.y -= 6 * dt; s.m.position.addScaledVector(s.v, dt); s.m.visible = true; on++; } else s.m.visible = false; });
      sparkLight.intensity = on ? rand(1, 4) : 0;
    },
  };
}

// ====================================================================
//  2) STÍNOVÁ COCOA (duše, která děsí)
// ====================================================================
{
  const g = new THREE.Group(); views.shadow = g; scene.add(g);
  const floor = new THREE.Mesh(new THREE.CircleGeometry(3, 40), mat('#08060a')); floor.rotation.x = -Math.PI / 2; g.add(floor);
  const shadowMat = new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: .88, depthWrite: true });
  // fialová mlha za ní, aby černá silueta vynikla
  const backTex = canvasTex(256, 256, (x, w, h) => { const gr = x.createRadialGradient(128, 128, 10, 128, 128, 128); gr.addColorStop(0, 'rgba(120,40,140,.85)'); gr.addColorStop(.6, 'rgba(50,10,70,.5)'); gr.addColorStop(1, 'rgba(0,0,0,0)'); x.fillStyle = gr; x.fillRect(0, 0, w, h); });
  const back = new THREE.Mesh(new THREE.PlaneGeometry(6, 6), new THREE.MeshBasicMaterial({ map: backTex, transparent: true, depthWrite: false })); back.position.set(0, 1.3, -1.6); g.add(back);
  const body = new THREE.Group(); g.add(body);
  const eyes = new THREE.Group(); body.add(eyes);
  const eyeMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
  for (const x of [-.16, .16]) { const e = new THREE.Mesh(new THREE.SphereGeometry(.055, 10, 8), eyeMat); e.position.set(x, 1.55, .42); eyes.add(e); }
  const glowL = new THREE.PointLight(0xffffff, 1.2, 2); glowL.position.set(0, 1.55, .6); body.add(glowL);
  // náhradní silueta, kdyby se model nenačetl
  const fallback = new THREE.Group(); body.add(fallback);
  box(.6, .8, .4, shadowMat, 0, .8, 0, fallback); const hd = new THREE.Mesh(new THREE.SphereGeometry(.42, 16, 12), shadowMat); hd.position.set(0, 1.5, 0); fallback.add(hd);
  for (const x of [-.12, .12]) box(.12, .7, .08, shadowMat, x, 2.15, -.1, fallback);
  new GLTFLoader().load('models/cocoa.glb', gl => {
    const m = gl.scene, b = new THREE.Box3().setFromObject(m), s = 1.85 / b.getSize(new THREE.Vector3()).y;
    m.scale.setScalar(s); m.position.set(-(b.min.x + b.max.x) / 2 * s, -b.min.y * s, -(b.min.z + b.max.z) / 2 * s);
    m.traverse(o => { if (o.isMesh) { o.material = shadowMat; o.frustumCulled = false; } });
    body.add(m); fallback.visible = false;
    const nb = new THREE.Box3().setFromObject(m); eyes.position.set(0, nb.max.y * .78 - 1.55, nb.max.z * .9 - .42);
  }, undefined, () => {});
  // kouř kolem
  const smokeTex = canvasTex(64, 64, (x, w, h) => { const gr = x.createRadialGradient(32, 32, 2, 32, 32, 32); gr.addColorStop(0, 'rgba(20,10,30,.9)'); gr.addColorStop(1, 'rgba(0,0,0,0)'); x.fillStyle = gr; x.fillRect(0, 0, w, h); });
  const puffs = []; for (let i = 0; i < 40; i++) { const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: smokeTex, transparent: true, depthWrite: false, opacity: .6 })); sp.position.set(rand(-1, 1), rand(0, 2.2), rand(-.8, .8)); sp.scale.setScalar(rand(.5, 1.2)); g.add(sp); puffs.push({ s: sp, v: rand(.1, .35), ph: rand(0, 6) }); }
  g.userData = {
    cam: [0, 1.4, 4.4], target: [0, 1.1, 0],
    info: '<b>STÍNOVÁ COCOA</b><br>Po požáru z Cocoy zbyla jen černá silueta se svítícíma očima, duše, která tu straší. Mizí a objevuje se, kolem ní se valí kouř. Nápad do hry: na kamerách je vidět jen chvilku. Když se objeví přímo v kanceláři, musíš se na ni podívat baterkou, jinak vysaje proud. Někdy ti šeptá rady, protože pořád chce pomáhat.',
    update(t, dt) {
      const vis = Math.sin(t * .9) > -.6 || Math.random() < .05;
      body.visible = vis; shadowMat.opacity = .75 + Math.sin(t * 5) * .1;
      body.position.y = Math.sin(t * 1.3) * .05; body.rotation.y = Math.sin(t * .4) * .5;
      eyeMat.color.setScalar(Math.random() < .06 ? .2 : 1); glowL.intensity = vis ? 1.2 : 0;
      puffs.forEach(p => { p.s.position.y += p.v * dt; p.s.position.x += Math.sin(t + p.ph) * .002; if (p.s.position.y > 2.6) p.s.position.y = 0; p.s.material.opacity = .45 * Math.sin(p.s.position.y / 2.6 * Math.PI); });
    },
  };
}

// ====================================================================
//  3) ZNIČENÁ RESTAURACE (bez proudu, funkční jen počítač s kamerami)
// ====================================================================
{
  const g = new THREE.Group(); views.ruins = g; scene.add(g);
  const soot = canvasTex(128, 128, (x, w, h) => { x.fillStyle = '#2a2230'; x.fillRect(0, 0, w, h); for (let i = 0; i < 70; i++) { const gr = x.createRadialGradient(rand(0, w), rand(0, h), 1, rand(0, w), rand(0, h), rand(8, 30)); gr.addColorStop(0, 'rgba(0,0,0,.85)'); gr.addColorStop(1, 'rgba(0,0,0,0)'); x.fillStyle = gr; x.fillRect(0, 0, w, h); } });
  soot.wrapS = soot.wrapT = THREE.RepeatWrapping; soot.repeat.set(3, 1);
  const wall = new THREE.MeshLambertMaterial({ map: soot }), floorTex = canvasTex(64, 64, (x, w, h) => { for (let i = 0; i < 8; i++) for (let j = 0; j < 8; j++) { x.fillStyle = (i + j) % 2 ? '#141012' : '#2a2226'; x.fillRect(i * 8, j * 8, 8, 8); } for (let i = 0; i < 25; i++) { x.fillStyle = 'rgba(0,0,0,.6)'; x.fillRect(rand(0, 64), rand(0, 64), rand(3, 12), rand(3, 12)); } });
  floorTex.wrapS = floorTex.wrapT = THREE.RepeatWrapping; floorTex.repeat.set(6, 5); floorTex.magFilter = THREE.NearestFilter;
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(14, 10), new THREE.MeshLambertMaterial({ map: floorTex })); floor.rotation.x = -Math.PI / 2; g.add(floor);
  box(14, 3.4, .2, wall, 0, 1.7, -5, g); box(.2, 3.4, 10, wall, -7, 1.7, 0, g); box(.2, 3.4, 10, wall, 7, 1.7, 0, g);
  // zřícený strop: trámy a díra
  for (const [x, rz, ry] of [[-2, .5, .2], [1.5, -.35, -.3], [4, .2, .6]]) { const b = box(.3, .3, 7, mat('#1a1210'), x, 1.6, -1, g); b.rotation.set(rz, ry, .3); }
  box(9, .2, 4, mat('#120c0c'), -2, 3.4, 2, g);
  // trosky, převrácené stoly a ohořelé automaty
  for (let i = 0; i < 30; i++) { const d = box(rand(.2, .8), rand(.1, .4), rand(.2, .8), mat(['#2a2020', '#1a1414', '#3a2a20'][i % 3]), rand(-6, 6), .1, rand(-4.5, 4), g); d.rotation.set(rand(-.3, .3), rand(0, 3), rand(-.3, .3)); }
  for (const [x, z, r] of [[-3, 1, 1.2], [2.5, 2, -.7]]) { const t = new THREE.Group(); const top = new THREE.Mesh(new THREE.CylinderGeometry(.8, .8, .08, 16), mat('#3a2a2a')); top.position.y = .78; t.add(top); box(.1, .75, .1, mat('#222'), 0, .38, 0, t); t.position.set(x, .4, z); t.rotation.set(r, 0, .3); g.add(t); }
  for (let i = 0; i < 4; i++) { const c = new THREE.Group(); box(.8, 1.8, .7, mat('#141216'), 0, .9, 0, c); box(.6, .45, .02, mat('#050505'), 0, 1.25, .36, c); c.position.set(-5.5 + i * 1.2, 0, -4.4); c.rotation.z = i === 2 ? .5 : 0; if (i === 2) c.position.y = .3; g.add(c); }
  // spadlý nápis VOXIE'S – blikají dvě písmena
  const signTex = canvasTex(512, 128, (x, w, h) => { x.font = 'bold 90px Courier New'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillStyle = '#3a1a30'; x.fillText("VOXIE'S", w / 2, h / 2); });
  const sign = new THREE.Mesh(new THREE.PlaneGeometry(3, .75), new THREE.MeshBasicMaterial({ map: signTex, transparent: true })); sign.position.set(1.5, .3, -3.5); sign.rotation.set(-1.2, 0, .35); g.add(sign);
  const lit = new THREE.Mesh(new THREE.PlaneGeometry(.7, .55), new THREE.MeshBasicMaterial({ color: 0xff2bd6 })); lit.position.set(.65, .36, -3.42); lit.rotation.copy(sign.rotation); g.add(lit);
  // stůl s jediným funkčním počítačem
  box(2.2, .08, 1, mat('#2a1e16'), 3.5, .78, 2.8, g); box(.08, .74, .9, mat('#1a1410'), 2.5, .39, 2.8, g); box(.08, .74, .9, mat('#1a1410'), 4.5, .39, 2.8, g);
  box(.8, .6, .6, mat('#2a2a30'), 3.5, 1.12, 2.6, g);
  const crt = canvasTex(256, 192, () => {});
  const screen = new THREE.Mesh(new THREE.PlaneGeometry(.64, .46), new THREE.MeshBasicMaterial({ map: crt })); screen.position.set(3.5, 1.13, 2.91); g.add(screen);
  const screenLight = new THREE.PointLight(0x40ff80, 2, 4, 1.4); screenLight.position.set(3.5, 1.2, 3.3); g.add(screenLight);
  // padající popel
  const ash = new THREE.InstancedMesh(new THREE.BoxGeometry(.012, .012, .012), new THREE.MeshBasicMaterial({ color: 0x5a5050 }), 300), ashP = [];
  for (let i = 0; i < 300; i++) ashP.push([rand(-6.5, 6.5), rand(0, 3.3), rand(-4.5, 4.5), rand(.1, .3)]); g.add(ash);
  const emergency = new THREE.PointLight(0xff1a0a, 0, 10, 1.2); emergency.position.set(-6.5, 3, -4.5); g.add(emergency);
  const m4 = new THREE.Matrix4();
  g.userData = {
    cam: [5.5, 2.2, 6.5], target: [0, .9, -.5], fog: true,
    info: '<b>ZNIČENÁ RESTAURACE</b><br>Herna po požáru: bez proudu, se spadlým stropem, ohořelými automaty, převrácenými stoly a padajícím popelem. Svítí jen nouzové světlo a starý počítač. Na jeho kamerách z 10 fungují jen 3 (CAM 2, 5, 8), ostatní ukazují „NO SIGNAL“. Nápad do hry: hlídáš z tohohle počítače a kamery opravuješ prohozením kabelů. Baterie počítače je jediný zdroj proudu.',
    update(t, dt) {
      emergency.intensity = Math.sin(t * 3) > 0 ? 6 : .5;
      lit.visible = Math.random() > .25;
      for (let i = 0; i < 300; i++) { const a = ashP[i]; a[1] -= a[3] * dt; a[0] += Math.sin(t + i) * .002; if (a[1] < 0) a[1] = 3.3; m4.makeTranslation(a[0], a[1], a[2]); ash.setMatrixAt(i, m4); }
      ash.instanceMatrix.needsUpdate = true;
      if (Math.floor(t * 4) !== Math.floor((t - dt) * 4)) {
        const c = crt.image.getContext('2d'); c.fillStyle = '#031208'; c.fillRect(0, 0, 256, 192);
        c.fillStyle = '#5dff8a'; c.font = 'bold 16px Courier New'; c.fillText('VOXIE-CAM v2  [BATERIE 37%]', 8, 20);
        ['2', '5', '8', '1A', '1B', '3'].forEach((id, i) => { const x = 8 + (i % 3) * 82, y = 34 + Math.floor(i / 3) * 76, ok = i < 3; c.strokeStyle = '#2a6a3a'; c.strokeRect(x, y, 76, 66);
          if (ok) { c.fillStyle = '#0a2a14'; c.fillRect(x + 1, y + 1, 74, 64); for (let k = 0; k < 40; k++) { c.fillStyle = `rgba(93,255,138,${Math.random() * .25})`; c.fillRect(x + Math.random() * 74, y + Math.random() * 64, 2, 2); } c.fillStyle = '#5dff8a'; }
          else { for (let k = 0; k < 120; k++) { const v = Math.random() * 120; c.fillStyle = `rgb(${v},${v},${v})`; c.fillRect(x + Math.random() * 74, y + Math.random() * 64, 3, 3); } c.fillStyle = '#ff5050'; c.fillText('NO SIGNAL', x + 3, y + 40); c.fillStyle = '#5dff8a'; }
          c.fillText('CAM ' + id, x + 4, y + 16); });
        crt.needsUpdate = true;
      }
    },
  };
}

// ====================================================================
let current = 'voxie';
function show(v) {
  current = v; for (const k in views) views[k].visible = k === v;
  const u = views[v].userData; camera.position.set(...u.cam); controls.target.set(...u.target); controls.update();
  key.intensity = v === 'ruins' ? 18 : 40; hemi.intensity = v === 'ruins' ? .55 : .5; red.intensity = v === 'shadow' ? 2 : 6;
  document.getElementById('info').innerHTML = u.info;
  document.querySelectorAll('#ui button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
}
document.querySelectorAll('#ui button').forEach(b => b.onclick = () => show(b.dataset.v));
show(new URLSearchParams(location.search).get('v') || 'voxie');
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => { const dt = Math.min(.05, clock.getDelta()), t = clock.elapsedTime; views[current].userData.update(t, dt); if (current !== 'ruins') views[current].rotation.y += dt * .25; controls.update(); renderer.render(scene, camera); });
window.__p = { show };
</script>

function move(dt) {

// ---------- vstup ----------
let joy = null, drag = null; const keys = {};

addEventListener('keydown', e => { initAudio(); keys[e.key.toLowerCase()] = true; }); addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

// ---------- smyčka ----------
const clock = new THREE.Clock(); let manualT = null;
function render(t, dt) {

name: Night at Voxie's – APK

on:
  push:
    paths:
      - 'voxies/**'
      - '.github/workflows/voxies-apk.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: voxies
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Instalace Capacitoru
        run: npm install
      - name: Vytvoření Android projektu
        run: |
          pip install pillow
          npx cap add android
          python3 tools/android_setup.py
          npx cap sync android
      - name: Sestavení APK
        working-directory: voxies/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: night-at-voxies-apk
          path: voxies/android/app/build/outputs/apk/debug/app-debug.apk

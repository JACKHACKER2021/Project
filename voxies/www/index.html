<script>
'use strict';
// ====================================================================
//  NIGHT AT VOXIE'S – noční hlídač ve Voxie's Fun Factory
// ====================================================================
const W = 1280, H = 720;
const FONT = "'Courier New', 'Lucida Console', monospace";
const HOUR = 70;                       // reálné sekundy na herní hodinu (6 h ≈ 7 min)
const MOVE_INT = 5;                    // jak často dostane Voxie šanci se pohnout
const SPEED = +new URLSearchParams(location.search).get('speed') || 1;

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let K = 1;

function resize() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.style.width = W * s + 'px';
  cv.style.height = H * s + 'px';
  cv.width = Math.round(W * s * dpr);
  cv.height = Math.round(H * s * dpr);
  K = cv.width / W;
}
addEventListener('resize', resize);
resize();

// ---------- úložiště ----------
function load(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }
function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

// ---------- pomocné ----------
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  if (f < 0) { r *= 1 + f; g *= 1 + f; b *= 1 + f; }
  else { r += (255 - r) * f; g += (255 - g) * f; b += (255 - b) * f; }
  return `rgb(${r | 0},${g | 0},${b | 0})`;
}
function poly(p, fill) {
  ctx.beginPath(); ctx.moveTo(p[0], p[1]);
  for (let i = 2; i < p.length; i += 2) ctx.lineTo(p[i], p[i + 1]);
  ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
}
function rr(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function rect(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); }
function txt(s, x, y, size, col, align = 'left', weight = 'bold') {
  ctx.font = `${weight} ${size}px ${FONT}`; ctx.fillStyle = col; ctx.textAlign = align; ctx.textBaseline = 'alphabetic';
  ctx.fillText(s, x, y);
}
function neon(s, x, y, size, col, blur = 18, align = 'center') {
  ctx.save(); ctx.shadowColor = col; ctx.shadowBlur = blur; txt(s, x, y, size, col, align); txt(s, x, y, size, '#ffffff', align); ctx.globalAlpha = .55; txt(s, x, y, size, col, align); ctx.restore();
}
function wrap(s, maxW, size) {
  ctx.font = `bold ${size}px ${FONT}`;
  const words = s.split(' '), lines = []; let line = '';
  for (const w of words) { const t = line ? line + ' ' + w : w; if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t; }
  if (line) lines.push(line);
  return lines;
}
// kostka – přední stěna x,y,w,h, hloubka d šikmo nahoru doprava
function cube(x, y, w, h, d, col, grid) {
  const dx = d * .7, dy = d * .5;
  poly([x, y, x + w, y, x + w + dx, y - dy, x + dx, y - dy], shade(col, .22));
  poly([x + w, y, x + w + dx, y - dy, x + w + dx, y + h - dy, x + w, y + h], shade(col, -.38));
  ctx.fillStyle = col; ctx.fillRect(x, y, w, h);
  if (grid) {
    ctx.strokeStyle = 'rgba(0,0,0,.16)'; ctx.lineWidth = 1; ctx.beginPath();
    for (let gx = x + grid; gx < x + w - 1; gx += grid) { ctx.moveTo(gx, y); ctx.lineTo(gx, y + h); }
    for (let gy = y + grid; gy < y + h - 1; gy += grid) { ctx.moveTo(x, gy); ctx.lineTo(x + w, gy); }
    ctx.stroke();
  }
}
function floorGrid(bx0, bx1, by, fx0, fx1, fy, M, N, c1, c2) {
  const P = (i, j) => { const t = Math.pow(j / N, 1.6); const xb = bx0 + (bx1 - bx0) * i / M, xf = fx0 + (fx1 - fx0) * i / M; return [xb + (xf - xb) * t, by + (fy - by) * t]; };
  for (let j = 0; j < N; j++) for (let i = 0; i < M; i++) {
    const a = P(i, j), b = P(i + 1, j), c = P(i + 1, j + 1), d = P(i, j + 1);
    poly([a[0], a[1], b[0], b[1], c[0], c[1], d[0], d[1]], (i + j) % 2 ? c1 : c2);
  }
}
function vignette(a, cx = W / 2, cy = H / 2, r0 = 200, r1 = 820) {
  const g = ctx.createRadialGradient(cx, cy, r0, cx, cy, r1);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${a})`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

// ---------- šum a scanlines ----------
const noiseFrames = [];
for (let f = 0; f < 5; f++) {
  const c = document.createElement('canvas'); c.width = 320; c.height = 180;
  const x = c.getContext('2d'), id = x.createImageData(320, 180);
  for (let i = 0; i < id.data.length; i += 4) { const v = Math.random() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; }
  x.putImageData(id, 0, 0); noiseFrames.push(c);
}
const scan = document.createElement('canvas'); scan.width = 4; scan.height = 4;
{ const x = scan.getContext('2d'); x.fillStyle = 'rgba(0,0,0,.35)'; x.fillRect(0, 0, 4, 1); x.fillRect(0, 2, 4, 1); }
let scanPat = null;
function noise(a) { if (a <= 0) return; ctx.save(); ctx.globalAlpha = Math.min(1, a); ctx.imageSmoothingEnabled = false; ctx.drawImage(noiseFrames[(Math.random() * 5) | 0], 0, 0, W, H); ctx.restore(); }
function scanlines() { if (!scanPat) scanPat = ctx.createPattern(scan, 'repeat'); ctx.fillStyle = scanPat; ctx.fillRect(0, 0, W, H); }

// ====================================================================
//  ZVUK (vše syntetizované přes WebAudio, žádné soubory)
// ====================================================================
let AC = null, master = null, noiseBuf = null, ambient = null, buzz = null, musicBoxTimer = null;
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  master = AC.createGain(); master.gain.value = .85; master.connect(AC.destination);
  noiseBuf = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
  const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
}
function panNode(p) { if (AC.createStereoPanner) { const n = AC.createStereoPanner(); n.pan.value = clamp(p, -1, 1); return n; } return AC.createGain(); }
function out(node, pan) { const p = panNode(pan || 0); node.connect(p); p.connect(master); }
function tone(freq, type, dur, vol, pan = 0, when = 0, slideTo = 0) {
  if (!AC) return;
  const t = AC.currentTime + when, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g); out(g, pan); o.start(t); o.stop(t + dur + .05);
}
function noiseHit(dur, vol, freq, type = 'lowpass', pan = 0, when = 0, q = 1) {
  if (!AC) return;
  const t = AC.currentTime + when, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; f.type = type; f.frequency.value = freq; f.Q.value = q;
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  s.connect(f); f.connect(g); out(g, pan); s.start(t, Math.random()); s.stop(t + dur + .05);
}
const SFX = {
  door(pan) { noiseHit(.4, .5, 500, 'lowpass', pan); tone(90, 'square', .25, .18, pan, 0, 40); noiseHit(.12, .3, 2500, 'bandpass', pan, .32, 3); },
  click() { tone(1800, 'square', .03, .06); },
  cam() { tone(1000, 'square', .05, .05); noiseHit(.18, .12, 3000, 'highpass'); },
  tablet() { noiseHit(.25, .12, 1200, 'bandpass'); tone(400, 'sine', .2, .05, 0, 0, 800); },
  step(pan, vol) { tone(65, 'sine', .22, vol, pan, 0, 35); noiseHit(.09, vol * .5, 350, 'lowpass', pan); },
  steps(pan, n, vol, gap = .48, fade = 0) { for (let i = 0; i < n; i++) setTimeout(() => SFX.step(pan, Math.max(.02, vol - fade * i)), i * gap * 1000); },
  knock(pan) { for (let i = 0; i < 3; i++) { tone(210, 'triangle', .14, .35, pan, i * .2); noiseHit(.08, .25, 1400, 'bandpass', pan, i * .2, 4); } },
  sting() { tone(110, 'sawtooth', 1.1, .12, -.6, 0, 104); tone(116.5, 'sawtooth', 1.1, .1, -.6); tone(55, 'square', 1.1, .08, -.6); },
  growl() { tone(70, 'sawtooth', .8, .15, -.7, 0, 45); noiseHit(.8, .12, 300, 'lowpass', -.7); },
  laugh(pan = 0) { for (let i = 0; i < 4; i++) { tone(330 - i * 18, 'square', .13, .045, pan, i * .2, 300 - i * 18); } },
  scare() {
    if (!AC) return;
    noiseHit(1.3, .7, 1800, 'bandpass', 0, 0, .7);
    tone(380, 'sawtooth', 1.2, .35, -.2, 0, 950); tone(395, 'sawtooth', 1.2, .35, .2, 0, 1000); tone(120, 'square', 1.2, .3, 0, 0, 60);
  },
  chime() { for (let i = 0; i < 6; i++) { tone(784, 'sine', 1.6, .22, 0, i * .85); tone(1568, 'sine', .8, .06, 0, i * .85); tone(392, 'triangle', 1.2, .08, 0, i * .85); } },
  ring() { for (let r = 0; r < 2; r++) for (let i = 0; i < 10; i++) { tone(440, 'square', .05, .03, .4, r * 1.4 + i * .06); tone(480, 'square', .05, .03, .4, r * 1.4 + i * .06); } },
  powerDown() { tone(240, 'sawtooth', 1.8, .2, 0, 0, 25); noiseHit(1.2, .2, 200); },
  arcade(pan) { const b = pick([523, 587, 659, 784]); for (let i = 0; i < 4; i++) tone(b * [1, 1.25, 1.5, 2][i], 'square', .08, .018, pan, i * .09); },
  clank(pan) { tone(620, 'triangle', .3, .1, pan, 0, 580); tone(930, 'triangle', .25, .05, pan); noiseHit(.15, .1, 3000, 'bandpass', pan, 0, 6); },
};
function startAmbient() {
  if (!AC || ambient) return;
  const g = AC.createGain(); g.gain.value = .0001; g.gain.exponentialRampToValueAtTime(1, AC.currentTime + 2); g.connect(master);
  const h = AC.createOscillator(); h.type = 'sine'; h.frequency.value = 55;
  const hg = AC.createGain(); hg.gain.value = .025; h.connect(hg); hg.connect(g); h.start();
  const n = AC.createBufferSource(); n.buffer = noiseBuf; n.loop = true;
  const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 380;
  const ng = AC.createGain(); ng.gain.value = .05; n.connect(f); f.connect(ng); ng.connect(g); n.start();
  ambient = { g, nodes: [h, n] };
}
function stopAmbient() {
  if (!ambient) return;
  const a = ambient; ambient = null;
  a.g.gain.setValueAtTime(a.g.gain.value, AC.currentTime); a.g.gain.exponentialRampToValueAtTime(.0001, AC.currentTime + .3);
  setTimeout(() => a.nodes.forEach(n => { try { n.stop(); } catch (e) {} }), 400);
}
function setBuzz(on, pan) {
  if (!AC) return;
  if (buzz) { const b = buzz; buzz = null; b.g.gain.setValueAtTime(b.g.gain.value, AC.currentTime); b.g.gain.exponentialRampToValueAtTime(.0001, AC.currentTime + .05); setTimeout(() => { try { b.o.stop(); } catch (e) {} }, 100); }
  if (on) {
    const o = AC.createOscillator(), f = AC.createBiquadFilter(), g = AC.createGain();
    o.type = 'sawtooth'; o.frequency.value = 118; f.type = 'bandpass'; f.frequency.value = 900; f.Q.value = 2;
    g.gain.value = .045; o.connect(f); f.connect(g); out(g, pan); o.start(); buzz = { o, g };
  }
}
// vlastní melodie hrací skříňky
const BOX = [12, 7, 9, 7, 4, 7, 2, 4, 5, 9, 12, 14, 12, 9, 7, -1, 12, 7, 9, 7, 4, 2, 0, 2, 4, 5, 4, 2, 0, -1, -1, -1];
function startMusicBox() {
  if (!AC || musicBoxTimer) return;
  let i = 0;
  musicBoxTimer = setInterval(() => {
    const n = BOX[i++ % BOX.length];
    if (n >= 0) { const f = 523.25 * Math.pow(2, n / 12); tone(f, 'triangle', .5, .09, -.8); tone(f * 2, 'sine', .25, .03, -.8); }
  }, 290);
}
function stopMusicBox() { clearInterval(musicBoxTimer); musicBoxTimer = null; }

// ---------- hlas telefonu (jen když zařízení umí česky) ----------
let csVoice = null;
function findVoice() { try { const v = speechSynthesis.getVoices(); csVoice = v.find(x => /^cs/i.test(x.lang)) || null; } catch (e) {} }
try { speechSynthesis.onvoiceschanged = findVoice; findVoice(); } catch (e) {}
function speak(s) { if (!csVoice) return; try { const u = new SpeechSynthesisUtterance(s); u.voice = csVoice; u.lang = csVoice.lang; u.rate = 1.05; u.pitch = .8; u.volume = .9; speechSynthesis.speak(u); } catch (e) {} }
function hush() { try { speechSynthesis.cancel(); } catch (e) {} }

// ====================================================================
//  STAV HRY
// ====================================================================
let scene = 'menu', sceneT = 0, G = null;
let progress = load('voxies_night', 1);
let beaten = load('voxies_beaten', false);
let buttons = [], hoverBtn = null, mouse = { x: -1, y: -1 };

function newGame(n) {
  G = {
    night: n, t: 0, power: 100,
    doorL: false, doorR: false, aL: 0, aR: 0, light: null, cams: false, camA: 0, cam: '1A', camStatic: 0,
    vox: { pos: '1A', timer: 0, lit: 0, seen: false, warned: false, attack: false, attackT: 0, retreatT: 0 },
    out: false, outT: 0, outPhase: 0, outDur: [0, 0, 0],
    call: { i: -1, t: 0, on: true, ring: 3.2, lines: CALLS[n - 1] || [] },
    flick: 0, ambT: rand(12, 25), fanA: 0, killer: null,
  };
  scene = 'intro'; sceneT = 0;
}
function hourOf() { return Math.min(6, Math.floor(G.t / HOUR)); }
function voxLevel() { return VOX_LEVELS[G.night - 1][Math.min(5, hourOf())]; }
function usage() { return G.out ? 0 : 1 + (G.doorL ? 1 : 0) + (G.doorR ? 1 : 0) + (G.light ? 1 : 0) + (G.cams ? 1 : 0); }

function toggleDoor(side) {
  if (scene !== 'play' || G.out) return;
  if (side === 'L') G.doorL = !G.doorL; else G.doorR = !G.doorR;
  SFX.door(side === 'L' ? -.8 : .8);
}
function setLight(side) {
  if (scene !== 'play' || G.out) return;
  const prev = G.light;
  G.light = (G.light === side || side == null) ? null : side;
  if (prev === 'L' && G.light !== 'L') checkFlash();
  if (G.light) SFX.click();
  setBuzz(!!G.light, G.light === 'L' ? -.8 : .8);
  const v = G.vox;
  if (G.light === 'L' && v.pos === 'DOOR' && !G.doorL && !v.seen) { v.seen = true; SFX.sting(); }
}

function update(dt) {
  sceneT += dt;
  if (scene !== 'play') {
    if (scene === 'intro' && sceneT > 3) { scene = 'play'; sceneT = 0; startAmbient(); }
    if (scene === 'scare' && sceneT > 1.25) { scene = 'dead'; sceneT = 0; }
    return;
  }
  G.t += dt;
  if (G.t >= 6 * HOUR) { win(); return; }
  G.aL += ((G.doorL ? 1 : 0) - G.aL) * Math.min(1, dt * 14);
  G.aR += ((G.doorR ? 1 : 0) - G.aR) * Math.min(1, dt * 14);
  G.camA = clamp(G.camA + (G.cams ? dt : -dt) * 5, 0, 1);
  G.camStatic = Math.max(0, G.camStatic - dt);
  G.fanA += dt * 18;
  G.flick = Math.random() < .015 ? rand(.05, .2) : Math.max(0, G.flick - dt);
  if (G.out) { outUpdate(dt); return; }
  G.power -= usage() * DRAIN[G.night - 1] * dt;
  if (G.power <= 0) { powerOut(); return; }
  voxUpdate(dt);
  // telefon
  const c = G.call;
  if (c.on) {
    if (c.ring > 0) { if (Math.floor(c.ring / 1.6) !== Math.floor((c.ring - dt) / 1.6) || c.ring === 3.2) SFX.ring(); c.ring -= dt; if (c.ring <= 0) { c.i = 0; c.t = 0; speak(c.lines[0]); } }
    else {
      c.t += dt;
      const dur = Math.max(3.2, c.lines[c.i].length * .068);
      if (c.t > dur) { c.i++; c.t = 0; if (c.i >= c.lines.length) c.on = false; else speak(c.lines[c.i]); }
    }
  }
  // atmosféra
  G.ambT -= dt;
  if (G.ambT <= 0) { G.ambT = rand(15, 35); (Math.random() < .6 ? SFX.arcade : SFX.clank)(rand(-.7, .7)); }
}

function toLogical(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; }
function hit(p) { for (let i = buttons.length - 1; i >= 0; i--) { const b = buttons[i]; if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) return b; } return null; }
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); initAudio();
  const b = hit(toLogical(e));
  if (b) { b.cb(); return; }
  if (scene === 'intro') { scene = 'play'; sceneT = 0; startAmbient(); }
});
cv.addEventListener('pointermove', e => { mouse = toLogical(e); const b = hit(mouse); hoverBtn = b ? b.id : null; });
addEventListener('keydown', e => {
  initAudio();
  if (scene !== 'play') return;
  const k = e.key.toLowerCase();
  if (k === 'a') toggleDoor('L');
  else if (k === 'd') toggleDoor('R');
  else if (k === 'q' && !G.cams) setLight('L');
  else if (k === 'e' && !G.cams) setLight('R');
  else if (k === ' ' || k === 's') { e.preventDefault(); toggleCams(); }
  else if (G.cams) { const map = { '1': '1A', '2': '1B', '3': '2', '4': '3', '5': '4', '6': '5', '7': '6', '8': '7', '9': '8', '0': '9' }; if (map[k]) selectCam(map[k]); }
});
document.addEventListener('visibilitychange', () => { if (document.hidden && AC) AC.suspend(); else if (AC) AC.resume(); });
// tlačítko Zpět na Androidu (Capacitor) – zpět do menu
document.addEventListener('backbutton', () => { if (scene !== 'menu') { setBuzz(false); stopMusicBox(); stopAmbient(); hush(); scene = 'menu'; sceneT = 0; } });

// ====================================================================
//  SMYČKA
// ====================================================================
let last = performance.now(), paused = false;
function frame(now) {
  let dt = Math.min(.1, (now - last) / 1000); last = now;
  if (document.hidden) dt = 0;
  update(dt * SPEED);
  render(now / 1000);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__voxies = { get G() { return G; }, get scene() { return scene; }, newGame, toggleDoor, setLight, toggleCams, selectCam };
</script>
